<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary SEO Meta Tags -->
    <title>RoomSplit — Smart Shared Expense & Bill Manager</title>
    <meta name="title" content="RoomSplit — Smart Shared Expense & Bill Manager" />
    <meta name="description" content="Effortlessly track flat expenses, split UPI & cash bills, manage roommate balances, and calculate settlements with custom and equal split calculations." />
    <meta name="keywords" content="expense splitter, roommate bill split, hisaab manager, shared expenses, splitwise alternative, track flat rent, UPI bill split" />
    <meta name="author" content="RoomSplit" />
    <meta name="robots" content="index, follow" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Open Graph / Facebook / WhatsApp Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://roomsplit.pages.dev/" />
    <meta property="og:title" content="RoomSplit — Smart Shared Expense & Bill Manager" />
    <meta property="og:description" content="Never argue over the hisaab again. Easily track who paid, split bills equally or unequally, and settle balances instantly." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=1200&h=630&q=80" />

    <!-- Twitter Card Preview -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://roomsplit.pages.dev/" />
    <meta property="twitter:title" content="RoomSplit — Smart Shared Expense & Bill Manager" />
    <meta property="twitter:description" content="Effortlessly split bills, manage roommate debt, and settle UPI or cash payments." />
    <meta property="twitter:image" content="https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=1200&h=630&q=80" />


    <!-- Mobile UI & PWA Capabilities -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RoomSplit" />

    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
      }
      .launch-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 24px;
        color: #fff;
        text-align: center;
        font-family: system-ui, sans-serif;
        background: radial-gradient(circle at 50% 38%, #3b82f6 0%, #1d4ed8 34%, #172554 100%);
      }
      .launch-screen__logo {
        width: clamp(144px, 44vw, 208px);
        height: clamp(144px, 44vw, 208px);
        object-fit: contain;
        border-radius: 28%;
        filter: drop-shadow(0 18px 32px rgb(0 0 0 / 25%));
        animation: launch-breathe 2s ease-in-out infinite;
      }
      .launch-screen__title {
        margin: 24px 0 0;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .launch-screen__subtitle {
        margin: 8px 0 0;
        color: rgb(255 255 255 / 82%);
        font-size: 14px;
      }
      .launch-screen__spinner {
        width: 26px;
        height: 26px;
        margin-top: 32px;
        border: 3px solid rgb(255 255 255 / 32%);
        border-top-color: #fff;
        border-radius: 50%;
        animation: launch-spin 0.8s linear infinite;
      }
      @keyframes launch-breathe {
        50% { transform: scale(1.035); }
      }
      @keyframes launch-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .launch-screen__logo, .launch-screen__spinner {
          animation: none;
        }
      }
    </style>

    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="/src/assets/roomsplit-icon.webp" />

    <!-- Apple Touch Icon for iOS Homescreen -->
    <link rel="apple-touch-icon" sizes="180x180" href="/src/assets/roomsplit-icon.webp" />
    <!-- Fallback if using webp -->
    <link rel="apple-touch-icon" href="/roomsplit-icon.webp" />

 

  </head>
  <body class="bg-slate-100 font-sans antialiased text-slate-800 selection:bg-indigo-500 selection:text-white">
    <div id="root">
      <main class="launch-screen" role="status" aria-label="Loading RoomSplit">
        <img class="launch-screen__logo" src="/roomsplit-icon.webp" alt="" />
        <h1 class="launch-screen__title">RoomSplit</h1>
        <p class="launch-screen__subtitle">Split bills. Stay balanced.</p>
        <span class="launch-screen__spinner" aria-hidden="true"></span>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
